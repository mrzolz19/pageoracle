<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageOracle - AI Book Reader (Web)</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="desktopViewport" class="desktop-viewport">
    <div id="desktopCanvas" class="desktop-canvas">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="logo">
            <h1>PageOracle</h1>
            <p>AI Book Reader</p>
          </div>

          <div class="divider"></div>

          <button id="btnLoad" class="btn-load" type="button">
            <span class="icon">+</span>
            Загрузить книгу
          </button>
          <input id="bookInput" type="file" accept=".txt,text/plain" hidden>

          <div class="section-label">Загруженные книги</div>
          <div id="booksList" class="books-list"></div>

          <div class="divider"></div>

          <button id="btnSettings" class="btn-settings" type="button">
            <span class="icon">⚙</span>
            Настройки
          </button>
        </aside>

        <main class="main-area">
          <div class="header">
            <h2>Чат с книгой</h2>
            <div class="status">
              <span id="statusDot" class="status-dot"></span>
              <span id="statusText">Инициализация...</span>
            </div>
          </div>

          <div class="mode-bar">
            <span class="mode-label">Режим:</span>
            <div class="mode-pills">
              <button type="button" class="mode-pill" data-mode="auto">Авто</button>
              <button type="button" class="mode-pill" data-mode="analysis">Анализ</button>
              <button type="button" class="mode-pill" data-mode="quote">Поиск цитат</button>
            </div>
          </div>

          <div id="chatContainer" class="chat-container"></div>

          <div class="input-bar">
            <input id="questionInput" class="input-field" type="text" placeholder="Задайте вопрос по загруженным книгам...">
            <button id="btnSend" class="btn-send" type="button">▶</button>
            <button id="btnClearChat" class="btn-clear" type="button" title="Очистить чат">🗑</button>
            <button id="btnClearHistory" class="btn-clear" type="button" title="Очистить историю">🧠</button>
          </div>

          <div class="logs-section">
            <div class="logs-header">
              <span>Системные логи</span>
              <button id="btnClearLogs" type="button">Очистить</button>
            </div>
            <div id="logsBox" class="logs-box"></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div id="settingsOverlay" class="settings-overlay hidden">
    <div class="settings-card">
      <div class="settings-header">
        <h2>⚙ Настройки</h2>
        <button id="btnManageCustomProviders" type="button" class="btn-subaction">⚙ Кастомные провайдеры</button>
      </div>
      <form id="settingsForm" novalidate>
        <div class="form-group">
          <label for="providerSelect">Провайдер ИИ</label>
          <select id="providerSelect" class="form-select"></select>
        </div>

        <div id="llmEndpointGroup" class="form-group hidden">
          <label for="llmEndpointInput">LLM Endpoint URL</label>
          <input id="llmEndpointInput" class="form-input" type="text" placeholder="http://localhost:11434/v1" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="modelInput">LLM модель</label>
          <input id="modelInput" list="modelDatalist" class="form-input" type="text" autocomplete="off" placeholder="Выберите или введите название модели...">
          <datalist id="modelDatalist"></datalist>
        </div>

        <div id="llmApiGroup" class="form-group">
          <label for="llmApiInput">API ключ от LLM</label>
          <input id="llmApiInput" class="form-input" type="password" autocomplete="off">
        </div>

        <div id="ycFolderGroup" class="form-group">
          <label for="ycFolderInput">YC_FOLDER_ID (для YandexGPT)</label>
          <input id="ycFolderInput" class="form-input" type="text" autocomplete="off">
        </div>

        <div class="form-divider"></div>
        <div class="section-label">Настройки эмбеддингов</div>

        <div class="form-group">
          <label for="embeddingInput">Embedding-модель</label>
          <input id="embeddingInput" list="embeddingDatalist" class="form-input" type="text" autocomplete="off" placeholder="Выберите или введите embedding-модель...">
          <datalist id="embeddingDatalist"></datalist>
        </div>

        <label class="checkbox-row" for="embeddingSameAsLlmCheckbox">
          <input id="embeddingSameAsLlmCheckbox" type="checkbox">
          Использовать тот же провайдер и endpoint для эмбеддингов
        </label>

        <div id="embeddingEndpointGroup" class="form-group">
          <label for="embeddingEndpointInput">Embedding Endpoint URL</label>
          <input id="embeddingEndpointInput" class="form-input" type="text" placeholder="http://localhost:11434/v1 (опционально)" autocomplete="off">
        </div>

        <div id="embeddingApiGroup" class="form-group">
          <label for="embeddingApiInput">API ключ embedding-модели</label>
          <input id="embeddingApiInput" class="form-input" type="password" autocomplete="off">
        </div>

        <div class="form-divider"></div>

        <label class="checkbox-row" for="showKeysCheckbox">
          <input id="showKeysCheckbox" type="checkbox">
          Показать ключи
        </label>

        <div class="settings-grid">
          <div class="form-group">
            <label for="temperatureInput">Temperature</label>
            <input id="temperatureInput" class="form-input" type="number" step="0.1" min="0" max="2">
          </div>

          <div class="form-group">
            <label for="maxTokensInput">Max Tokens</label>
            <input id="maxTokensInput" class="form-input" type="number" step="1" min="1">
          </div>

          <div class="form-group">
            <label for="topPInput">Top P</label>
            <input id="topPInput" class="form-input" type="number" step="0.05" min="0" max="1">
          </div>

          <div class="form-group">
            <label for="scoreThresholdInput">Score Threshold</label>
            <input id="scoreThresholdInput" class="form-input" type="number" step="0.05" min="0" max="1">
          </div>
        </div>

        <div class="settings-btns">
          <button id="btnCancelSettings" type="button" class="btn-cancel">Отмена</button>
          <button type="submit" class="btn-save">💾 Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div id="customProvidersOverlay" class="settings-overlay hidden">
    <div class="settings-card custom-providers-card">
      <div class="settings-header">
        <h2>⚙ Кастомные провайдеры</h2>
        <button id="btnCloseCustomProviders" type="button" class="btn-subaction">Закрыть</button>
      </div>

      <div class="custom-providers-body">
        <div class="custom-providers-list-section">
          <div class="section-label">Сохраненные провайдеры</div>
          <div id="customProvidersList" class="custom-providers-list"></div>
        </div>

        <div class="custom-provider-form-section">
          <div id="customFormHeading" class="section-label">Добавить провайдер</div>
          <form id="customProviderForm" novalidate>
            <input id="customEditIndex" type="hidden" value="-1">

            <div class="form-group">
              <label for="customNameInput">Название провайдера</label>
              <input id="customNameInput" class="form-input" type="text" placeholder="например, Ollama Local" required autocomplete="off">
            </div>

            <div class="form-group">
              <label for="customEndpointInput">Endpoint URL</label>
              <input id="customEndpointInput" class="form-input" type="text" placeholder="http://localhost:11434/v1" required autocomplete="off">
            </div>

            <div class="form-group">
              <label for="customApiKeyInput">API ключ (опционально)</label>
              <input id="customApiKeyInput" class="form-input" type="password" placeholder="Оставьте пустым, если не требуется" autocomplete="off">
            </div>

            <div class="form-group">
              <label for="customModelInput">Модель LLM по умолчанию</label>
              <input id="customModelInput" class="form-input" type="text" placeholder="например, llama3.2" autocomplete="off">
            </div>

            <div class="form-group">
              <label for="customEmbeddingModelInput">Embedding-модель по умолчанию</label>
              <input id="customEmbeddingModelInput" class="form-input" type="text" placeholder="например, nomic-embed-text" autocomplete="off">
            </div>

            <div class="custom-form-btns">
              <button id="btnCancelCustomForm" type="button" class="btn-cancel">Сбросить</button>
              <button id="btnSaveCustomProvider" type="submit" class="btn-save">💾 Сохранить профиль</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
