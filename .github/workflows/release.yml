name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: false
        default: ""
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            name: PageOracle-windows-x64-cpu
          - variant: cu128
            name: PageOracle-windows-x64-cu128

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install PyTorch and dependencies (CPU)
        if: matrix.variant == 'cpu'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          Get-Content tkinter_gui/requirements.txt | Where-Object { $_ -notmatch 'torch' -and $_ -notmatch '--extra-index-url' } | Set-Content reqs-cpu.txt
          pip install --no-cache-dir -r reqs-cpu.txt
          pip install --no-cache-dir pyinstaller

      - name: Install PyTorch and dependencies (CUDA 12.8)
        if: matrix.variant == 'cu128'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r tkinter_gui/requirements.txt
          pip install --no-cache-dir pyinstaller

      - name: Build standalone executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller pageoracle.spec --noconfirm --clean

      - name: Bundle starter books and settings template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/PageOracle/books"
          Copy-Item -Path "tkinter_gui/books/*.txt" -Destination "dist/PageOracle/books"
          Copy-Item -Path "settings.template.json" -Destination "dist/PageOracle/settings.json"

      - name: Compress distribution directory to zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PageOracle" -DestinationPath "${{ matrix.name }}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Tag
        id: vars
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == refs/tags/* ]]; then
            echo "tag=${REF_NAME#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=snapshot-$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
          IS_DRAFT: ${{ github.event.inputs.draft }}
        run: |
          DRAFT_FLAG=""
          if [ "$IS_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          gh release create "$TAG" release-assets/*.zip \
            --repo "$GH_REPO" \
            --title "PageOracle $TAG" \
            --generate-notes \
            $DRAFT_FLAG
